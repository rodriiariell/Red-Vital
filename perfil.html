<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · RedVital</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="perfil"><main><section class="page-hero"><div class="container profile-head" id="profile-summary"></div></section><section class="section soft-bg"><div class="container"><div class="card form-card"><div data-message class="message"></div><form id="profile-form" class="form-grid"><div class="field"><label for="firstName">Nombre</label><input id="firstName" name="firstName" required></div><div class="field"><label for="lastName">Apellido</label><input id="lastName" name="lastName"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="phone">Teléfono</label><input id="phone" name="phone" type="tel" required></div><div class="field full"><label for="bloodType">Grupo sanguíneo</label><select id="bloodType" name="bloodType" data-blood required><option value="" selected disabled>Seleccionar grupo sanguíneo</option></select></div><div class="field full"><label for="city">Localidad</label><div class="city-autocomplete"><input id="city" name="city" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="profile-city-suggestions" required><div id="profile-city-suggestions" class="city-suggestions" role="listbox" hidden></div></div><span class="field-error" data-error="city"></span></div><div id="availability-field" class="field full profile-availability" hidden><label class="profile-availability-control"><input class="profile-availability-checkbox" name="available" type="checkbox"><span class="profile-availability-indicator" aria-hidden="true"></span><span class="profile-availability-copy"><strong>Disponible para donar</strong><span class="help">Tu disponibilidad informa tu intención actual de donar. La aptitud definitiva debe ser evaluada por el centro de salud.</span></span></label></div><button class="btn btn-primary" type="submit">Guardar cambios</button></form></div></div></section></main><dialog id="confirm-dialog" class="modal"><div class="modal-inner"><h2></h2><p></p><div class="button-row"><button class="btn btn-primary" data-confirm>Confirmar</button><button class="btn btn-outline" onclick="this.closest('dialog').close()">Cancelar</button></div></div></dialog><script type="module" src="js/app.js"></script></body></html>
