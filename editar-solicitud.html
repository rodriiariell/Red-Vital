<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar solicitud · RedVital</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="editar"><main><section class="page-hero"><div class="container"><span class="eyebrow">Gestión</span><h1>Editar solicitud</h1><p>El ID y la fecha original se conservarán.</p></div></section><section class="section soft-bg"><div class="container"><div class="card form-card"><div data-message class="message"></div><form id="request-form" class="form-grid" novalidate><div class="field full"><label for="bloodType">Grupo requerido</label><select id="bloodType" name="bloodType" data-blood required><option value="" selected disabled>Seleccionar grupo sanguíneo</option></select><span class="field-error" data-error="bloodType"></span></div><div class="field full"><label for="hospital">Hospital / centro de salud</label><input id="hospital" name="hospital"><span class="field-error" data-error="hospital"></span></div><div class="field"><label for="city">Localidad</label><input id="city" name="city"><span class="field-error" data-error="city"></span></div><div class="field"><label for="urgency">Urgencia</label><select id="urgency" name="urgency"><option value="ALTO">🔴 Alto</option><option value="MEDIO">🟠 Medio</option><option value="BAJO">🟢 Bajo</option></select><span class="field-error" data-error="urgency"></span></div><div class="field"><label for="phone">WhatsApp / teléfono</label><input id="phone" name="phone"><span class="field-error" data-error="phone"></span></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email"><span class="field-error" data-error="email"></span></div><div class="field full"><label for="description">Descripción breve</label><textarea id="description" name="description" maxlength="300"></textarea><span class="field-error" data-error="description"></span></div><button class="btn btn-primary" type="submit">Guardar cambios</button></form></div></div></section></main><script type="module" src="js/app.js"></script></body></html>
