<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta · RedVital</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/responsive.css"></head><body data-page="registro"><main id="main"><section class="page-hero"><div class="container"><span class="eyebrow">Sumate a RedVital</span><h1>Creá tu cuenta</h1><p>Elegí cómo querés participar. Podés actualizar tus datos desde el perfil.</p></div></section><section class="section soft-bg"><div class="container"><div class="card form-card"><div data-message class="form-message" aria-live="polite"></div><form id="register-form" class="form-grid" novalidate><fieldset class="field full" style="border:0;padding:0"><legend class="legend">¿Cómo querés participar?</legend><div class="role-cards"><div class="role-card"><input id="role-donor" name="role" value="donor" type="radio" required><label for="role-donor"><strong>Donante</strong><br><span class="help">Quiero encontrar solicitudes.</span></label></div><div class="role-card"><input id="role-patient" name="role" value="patient" type="radio"><label for="role-patient"><strong>Paciente / Responsable</strong><br><span class="help">Necesito publicar una solicitud.</span></label></div></div><span class="field-error" data-error="role"></span></fieldset><div class="field"><label for="firstName">Nombre</label><input id="firstName" name="firstName" autocomplete="given-name"><span class="field-error" data-error="firstName"></span></div><div class="field"><label for="lastName">Apellido</label><input id="lastName" name="lastName" autocomplete="family-name"><span class="field-error" data-error="lastName"></span></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><span class="field-error" data-error="email"></span></div><div class="field"><label for="phone">Teléfono / WhatsApp</label><input id="phone" name="phone" type="tel" autocomplete="tel"><span class="field-error" data-error="phone"></span></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password"><span class="help">8 caracteres, una mayúscula y un número.</span><span class="field-error" data-error="password"></span></div><div class="field"><label for="confirm">Confirmar contraseña</label><input id="confirm" name="confirm" type="password" autocomplete="new-password"><span class="field-error" data-error="confirm"></span></div><div class="field full"><label for="bloodType">Grupo sanguíneo</label><select id="bloodType" name="bloodType" data-blood required><option value="" selected disabled>Seleccionar grupo sanguíneo</option></select><span class="field-error" data-error="bloodType"></span></div><div class="field full"><label for="city">Localidad</label><div class="city-autocomplete"><input id="city" name="city" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="city-suggestions"><div id="city-suggestions" class="city-suggestions" role="listbox" hidden></div></div><span class="field-error" data-error="city"></span></div><div id="donor-fields" class="field full availability-field" hidden><label class="availability-control"><input class="availability-checkbox" name="available" type="checkbox"><span class="availability-indicator" aria-hidden="true"></span><span class="availability-copy"><strong>Estoy disponible para donar</strong><span class="help">La aptitud definitiva debe ser evaluada por el centro de salud.</span></span></label></div><button class="btn btn-primary full" type="submit">Crear cuenta</button></form></div></div></section></main><script type="module" src="js/app.js"></script></body></html>
